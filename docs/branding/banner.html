<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @page { margin: 0 }
  * { margin: 0; padding: 0; box-sizing: border-box }
  body {
    width: 1280px; height: 360px; overflow: hidden;
    background: #070a10;
    font-family: "Segoe UI", "Segoe UI Variable Display", Arial, sans-serif;
    color: #e8eef7;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(39, 211, 230, .055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(39, 211, 230, .055) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 85% 120% at 78% 0%, #000 0%, transparent 72%);
  }
  .glow {
    position: absolute; width: 900px; height: 900px; right: -260px; top: -520px;
    background: radial-gradient(circle, rgba(39, 211, 230, .22) 0%, rgba(39, 211, 230, .06) 42%, transparent 68%);
    filter: blur(6px);
  }
  .glow2 {
    position: absolute; width: 620px; height: 620px; left: -220px; bottom: -420px;
    background: radial-gradient(circle, rgba(88, 101, 242, .16) 0%, transparent 66%);
  }
  .wrap { position: relative; padding: 58px 72px; height: 100%; display: flex; flex-direction: column; justify-content: space-between }
  .top { display: flex; align-items: flex-start; gap: 34px }
  .mark {
    display: flex; align-items: center; gap: 22px;
  }
  .bar { width: 6px; height: 96px; border-radius: 3px; background: linear-gradient(180deg, #27d3e6, #1b7f8c) }
  .wcs {
    font-size: 96px; font-weight: 800; letter-spacing: -1px; padding-right: 6px; line-height: .86;
    background: linear-gradient(180deg, #ffffff 0%, #9fb4c9 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .full { padding-top: 8px }
  .name { font-size: 27px; font-weight: 600; letter-spacing: .2px; color: #dbe6f3 }
  .tag { margin-top: 10px; font-size: 17px; color: #7d8fa5; letter-spacing: .2px; max-width: 560px; line-height: 1.45 }
  .bottom { display: flex; align-items: center; justify-content: space-between }
  .chips { display: flex; gap: 10px }
  .chip {
    font-size: 13px; letter-spacing: .6px; text-transform: uppercase;
    padding: 7px 13px; border-radius: 7px;
    border: 1px solid rgba(39, 211, 230, .28);
    background: rgba(39, 211, 230, .07);
    color: #8fe3ef; font-weight: 600;
  }
  .chip.dim { border-color: rgba(255,255,255,.10); background: rgba(255,255,255,.03); color: #8697ab }
  .ver { font-size: 17px; color: #5f7189; letter-spacing: 1.5px; font-weight: 600 }
  .ver b { color: #27d3e6; font-weight: 700 }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, #27d3e6 0%, rgba(39,211,230,.35) 32%, rgba(39,211,230,0) 62%) }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="wrap">
    <div class="top">
      <div class="mark">
        <div class="bar"></div>
        <div class="wcs">WCS</div>
      </div>
      <div class="full">
        <div class="name">Windows Config Studio</div>
        <div class="tag">Нативный тюнер Windows на C++20 и WebView2. Таймеры, MSI, службы, автозагрузка и память — с честным откатом.</div>
      </div>
    </div>
    <div class="bottom">
      <div class="chips">
        <div class="chip">C++20</div>
        <div class="chip">WebView2</div>
        <div class="chip dim">Windows 10 / 11</div>
        <div class="chip dim">MIT</div>
      </div>
      <div class="ver">RELEASE <b>3.6</b></div>
    </div>
  </div>
  <div class="rule"></div>
</body>
</html>
